<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My registrations · Campus Portal</title>
  <meta name="description" content="View and cancel your event registrations.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>
  <div id="verification-banner"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page__header">
        <h1>My registrations</h1>
        <p class="page__subtitle">
          Confirmed, waitlisted and cancelled places. Cancelling a confirmed seat
          automatically promotes the next person on the waitlist.
        </p>
      </div>

      <div id="registrations-tabs"></div>

      <div id="registrations-list" aria-live="polite" aria-busy="true">
        <div class="state"><div class="spinner" aria-hidden="true"></div><p>Loading your registrations…</p></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal · My registrations</span>
      <span><a href="/events.html">Browse more events</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/pages/my-registrations.js"></script>
</body>
</html>
