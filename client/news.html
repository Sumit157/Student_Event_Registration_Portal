<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus news · Campus Portal</title>
  <meta name="description" content="College news and announcements with discussion.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>
  <div id="verification-banner"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page__header">
        <h1>Campus news &amp; announcements</h1>
        <p class="page__subtitle">Official updates with a threaded discussion under each post.</p>
      </div>

      <div class="stack" id="news-list" aria-live="polite" aria-busy="true">
        <div class="state"><div class="spinner" aria-hidden="true"></div><p>Loading announcements…</p></div>
      </div>

      <div id="news-pagination" role="navigation" aria-label="News pages"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal · News</span>
      <span><a href="/events.html">Events</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/alumni.js"></script>
  <script src="/js/pages/news.js"></script>
</body>
</html>
