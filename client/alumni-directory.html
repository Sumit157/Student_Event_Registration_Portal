<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumni directory · Campus Portal</title>
  <meta name="description" content="Search verified and approved alumni by year, degree and company.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>
  <div id="verification-banner"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page__header">
        <h1>Alumni directory</h1>
        <p class="page__subtitle">
          Only profiles that are email-verified and approved by an administrator appear here.
        </p>
      </div>

      <!-- Filters ---------------------------------------------------------- -->
      <form class="filters" id="directory-filters" role="search" aria-label="Search alumni">
        <div class="field" style="grid-column:span 2;">
          <label class="field__label" for="q">Search</label>
          <input class="input" type="search" id="q" name="q" placeholder="Name, company, degree or role">
        </div>

        <div class="field">
          <label class="field__label" for="filter-year">Graduation year</label>
          <select class="select" id="filter-year" name="graduationYear">
            <option value="">Any year</option>
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="filter-degree">Degree</label>
          <select class="select" id="filter-degree" name="degree">
            <option value="">Any degree</option>
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="filter-company">Company</label>
          <select class="select" id="filter-company" name="company">
            <option value="">Any company</option>
          </select>
        </div>

        <div class="filters__actions">
          <button class="btn btn--primary" type="submit">Apply</button>
          <button class="btn btn--ghost" type="button" id="directory-clear">Clear</button>
        </div>
      </form>

      <!-- Results ---------------------------------------------------------- -->
      <div class="grid grid--cards" id="directory-grid" aria-live="polite" aria-busy="true">
        <div class="state"><div class="spinner" aria-hidden="true"></div><p>Loading alumni…</p></div>
      </div>

      <div id="directory-pagination" role="navigation" aria-label="Directory pages"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal · Alumni directory</span>
      <span class="footer__links"><a href="/jobs.html">Job board</a><a href="/connections.html">My network</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/alumni.js"></script>
  <script src="/js/pages/alumni-directory.js"></script>
</body>
</html>
