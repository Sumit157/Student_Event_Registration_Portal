<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Campus Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>

  <main id="main">
    <div class="auth">
      <div class="auth__card">
        <div class="auth__brand">
          <span class="navbar__logo" aria-hidden="true"></span>
          <span>Reset your password</span>
        </div>
        <h1 class="auth__title">Forgot your password?</h1>
        <p class="auth__subtitle">
          Enter the email address you registered with. If an account exists we will
          send a single-use link that expires in 30 minutes.
        </p>

        <div id="forgot-result" role="status" aria-live="polite"></div>

        <form class="form" id="forgot-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" required
                   autocomplete="email" placeholder="you@college.edu">
            <p class="field__error" aria-live="polite"></p>
          </div>
          <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
        </form>

        <p class="auth__footer">
          Remembered it? <a href="/login.html">Back to sign in</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal</span>
      <span><a href="/index.html">Home</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/forgot-password.js"></script>
</body>
</html>
