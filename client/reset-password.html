<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Campus Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>

  <main id="main">
    <div class="auth">
      <div class="auth__card">
        <div class="auth__brand">
          <span class="navbar__logo" aria-hidden="true"></span>
          <span>Choose a new password</span>
        </div>
        <h1 class="auth__title">Set a new password</h1>
        <p class="auth__subtitle">
          This link works once. Changing your password signs out every other session.
        </p>

        <div id="reset-result" role="status" aria-live="polite"></div>

        <form class="form" id="reset-form" novalidate>
          <div class="field">
            <label class="field__label" for="password">New password</label>
            <input class="input" type="password" id="password" name="password" required
                   autocomplete="new-password" placeholder="Create a new password">
            <p class="field__error" aria-live="polite"></p>
            <ul class="rules" id="reset-rules" aria-label="Password requirements"></ul>
          </div>

          <div class="field">
            <label class="field__label" for="confirmPassword">Confirm new password</label>
            <input class="input" type="password" id="confirmPassword" name="confirmPassword" required
                   autocomplete="new-password" placeholder="Type it again">
            <p class="field__error" aria-live="polite"></p>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Update password</button>
        </form>

        <p class="auth__footer"><a href="/login.html">Back to sign in</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal</span>
      <span><a href="/index.html">Home</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/reset-password.js"></script>
</body>
</html>
