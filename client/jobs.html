<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job board · Campus Portal</title>
  <meta name="description" content="Job openings and internships shared by alumni.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="navbar" id="shell-nav"></header>
  <div id="verification-banner"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page__header">
        <h1>Job board</h1>
        <p class="page__subtitle">Openings shared by alumni. Expired deadlines are hidden by default.</p>
      </div>

      <form class="filters" id="jobs-filters" role="search" aria-label="Search jobs">
        <div class="field" style="grid-column:span 2;">
          <label class="field__label" for="q">Search</label>
          <input class="input" type="search" id="q" name="q" placeholder="Title, company, location or description">
        </div>

        <div class="field">
          <label class="field__label" for="jobType">Type</label>
          <select class="select" id="jobType" name="jobType">
            <option value="">All types</option>
            <option value="full_time">Full time</option>
            <option value="part_time">Part time</option>
            <option value="internship">Internship</option>
            <option value="contract">Contract</option>
          </select>
        </div>

        <div class="filters__actions">
          <button class="btn btn--primary" type="submit">Search</button>
        </div>
      </form>

      <div class="stack" id="jobs-list" aria-live="polite" aria-busy="true">
        <div class="state"><div class="spinner" aria-hidden="true"></div><p>Loading opportunities…</p></div>
      </div>

      <div id="jobs-pagination" role="navigation" aria-label="Job pages"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>Campus Portal · Job board</span>
      <span><a href="/alumni-directory.html">Alumni directory</a></span>
    </div>
  </footer>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/alumni.js"></script>
  <script src="/js/pages/jobs.js"></script>
</body>
</html>
